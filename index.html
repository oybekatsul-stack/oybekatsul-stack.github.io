<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c140e">
<title>Детектив Энтик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=PT+Mono&display=swap">
<style>
/* Layout: pixel-art house on a dark oak desk; HUD above, touch controls below; puzzles open as parchment sheets over the map. */
:root{
  --oak:#1c140e; --oak-2:#2a1e15;
  --candle:#e8a33d; --candle-dim:#9c6a27;
  --parch:#efe3c8; --parch-2:#e2d2ae;
  --ink:#2b1d12; --ink-soft:#5e4834;
  --seal:#8e1f1f; --seal-hi:#b8322c; --ok:#3f6b3a; --muted:#c9b48e;
  --f-display:"Old Standard TT","Times New Roman",Georgia,serif;
  --f-body:"Lora",Georgia,"Times New Roman",serif;
  --f-mono:"PT Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--oak)}
body{margin:0;background:var(--oak);color:var(--parch);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--candle);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:12px 0 24px;display:flex;flex-direction:column;gap:10px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ttl{font-family:var(--f-display);font-weight:700;font-size:24px}
.date{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--candle)}

.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seals{display:flex;gap:6px}
.seal{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--candle-dim);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:12px;color:var(--candle-dim)}
.seal.done{background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal) 65%);border:none;color:var(--parch)}
.seal.now{border-style:solid;border-color:var(--candle);color:var(--candle)}
.meter{flex:1;min-width:150px;display:flex;flex-direction:column;gap:3px}
.meter-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.meter-bar{height:8px;border-radius:4px;background:var(--oak-2);overflow:hidden;border:1px solid rgba(232,163,61,.25)}
.meter-fill{height:100%;width:0;background:linear-gradient(90deg,var(--candle),var(--seal-hi));transition:width .5s}
.hint-btn{background:none;border:1px solid var(--candle-dim);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--candle)}
.goal{font-size:14px;color:var(--parch);background:var(--oak-2);border-left:3px solid var(--candle);padding:7px 10px}
.goal b{font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--candle);margin-right:6px}

.stage{position:relative;border:3px solid #0e0a07;box-shadow:0 14px 30px rgba(0,0,0,.6);background:#000;line-height:0}
#cv{display:block;width:100%;height:auto;touch-action:none}
.dialog{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(239,227,200,.97);color:var(--ink);border:2px solid var(--ink);border-radius:3px;padding:10px 12px 12px;line-height:1.45;font-size:15px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.dialog .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal);margin-bottom:2px}
.dialog .more{position:absolute;right:10px;bottom:4px;font-size:11px;color:var(--ink-soft);font-family:var(--f-mono)}

.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:4px}
.dpad button{background:var(--oak-2);border:1.5px solid var(--candle-dim);border-radius:8px;font-size:22px;color:var(--candle);display:flex;align-items:center;justify-content:center;touch-action:none}
.dpad button.on{background:var(--candle-dim);color:var(--oak)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.act{width:96px;height:96px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,var(--seal-hi),var(--seal) 70%);color:var(--parch);font-family:var(--f-display);font-size:17px;box-shadow:0 4px 0 #4a0f0f;touch-action:none}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 #4a0f0f}
.keys{font-size:13px;color:var(--muted);margin:0}
@media (hover:hover) and (pointer:fine) and (min-width:900px){ .controls{display:none} }

/* Overlays */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(14,10,7,.88);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet{max-width:680px;margin:0 auto;background:var(--parch);color:var(--ink);border-radius:3px;padding:22px 20px 24px;box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(139,99,52,.22);display:flex;flex-direction:column;gap:14px}
.sheet + .sheet{margin-top:14px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
h1,h2{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0}
h1{font-size:40px;color:var(--parch)}
h2{font-size:26px;color:var(--ink)}
p{margin:0}
.note{font-size:14px;color:var(--ink-soft)}
.task{border-left:3px solid var(--seal);padding-left:12px;font-style:italic}
.btn{background:var(--seal);color:var(--parch);border:none;border-radius:3px;padding:12px 18px;font-family:var(--f-display);font-size:18px;min-height:48px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink-soft)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.intro{max-width:680px;margin:0 auto 14px;display:flex;flex-direction:column;gap:10px}
.intro .lead{font-size:17px}
.intro .sub{color:var(--muted)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.book{background:var(--ink);color:var(--parch);border:none;border-radius:2px 6px 6px 2px;padding:12px 12px 12px 16px;text-align:left;min-height:90px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;box-shadow:inset 6px 0 0 rgba(0,0,0,.35)}
.book:nth-child(3n+2){background:#3d2716}.book:nth-child(3n){background:#28331f}
.book .t{font-family:var(--f-display);font-size:16px;line-height:1.2}
.book .y{font-family:var(--f-mono);font-size:12px;color:var(--candle)}
.book.read{outline:2px solid var(--candle-dim)}
.page{background:#fbf5e6;border:1px solid var(--parch-2);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.page .q{font-family:var(--f-display);font-style:italic;font-size:17px}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{background:#fbf5e6;border:1.5px solid var(--parch-2);border-radius:3px;padding:10px 12px;font-size:15px;text-align:left;color:var(--ink);min-height:44px}
.card.sel{border-color:var(--seal);box-shadow:inset 0 0 0 2px var(--seal)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:1.5px dashed var(--ink-soft);border-radius:3px;padding:10px;min-height:88px;background:rgba(255,255,255,.25);display:flex;flex-direction:column;gap:6px;text-align:left;color:var(--ink)}
.bin .bn{font-family:var(--f-display);font-weight:700;font-size:16px}
.bin .bd{font-size:12px;color:var(--ink-soft)}
.bin .placed{font-size:13px;background:var(--parch-2);border-radius:2px;padding:3px 6px}
.bin.armed{border-style:solid;border-color:var(--seal)}
.arg{display:flex;flex-direction:column;gap:8px}
.arg + .arg{border-top:1px solid var(--parch-2);padding-top:14px}
.arg .who{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--seal)}
.arg .claim{font-family:var(--f-display);font-size:18px;font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{background:#fbf5e6;border:1.5px solid var(--parch-2);border-radius:3px;padding:11px 12px;text-align:left;color:var(--ink);font-size:15px;min-height:44px}
.opt.right{border-color:var(--ok);background:#e4ecd8}
.opt.wrong{border-color:var(--seal);text-decoration:line-through;opacity:.65}
.assembled{min-height:110px;background:#fbf5e6;border:1px solid var(--parch-2);padding:14px 16px;font-family:var(--f-display);font-size:19px;line-height:1.5}
.assembled .ph{color:var(--ink-soft);font-family:var(--f-body);font-size:14px;font-style:italic}
.frags{display:flex;flex-wrap:wrap;gap:8px}
.frag{background:var(--ink);color:var(--parch);border:none;border-radius:2px;padding:10px 12px;font-family:var(--f-display);font-size:16px;text-align:left;min-height:44px}
.frag[disabled]{visibility:hidden}
.lock{display:flex;flex-direction:column;gap:12px}
.dial{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fbf5e6;border:1px solid var(--parch-2);padding:12px 14px}
.dial .stem{font-size:15px;min-width:0}
.dial .val{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--seal);display:block;margin-top:4px}
.turn{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--ink);background:radial-gradient(circle at 35% 30%,#c9a46a,#7a5a30);color:var(--parch);font-size:20px}
.fb{border-radius:3px;padding:12px 14px;font-size:15px}
.fb.good{background:#e4ecd8;border:1px solid var(--ok)}
.fb.bad{background:#f3dcd4;border:1px solid var(--seal)}
.fb b{font-family:var(--f-display)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#fbf5e6;border:1px solid var(--parch-2);padding:10px;display:flex;flex-direction:column}
.stat .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stat .v{font-family:var(--f-display);font-size:24px;font-weight:700}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--parch-2)}
.timeline .yr{font-family:var(--f-mono);font-size:14px;color:var(--seal)}
.timeline .cs{font-family:var(--f-display);font-weight:700}
.timeline .ln{font-size:14px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--seal);color:var(--parch);padding:10px 16px;border-radius:3px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.snd{background:none;border:1px solid var(--candle-dim);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--candle)}
.chapters{display:grid;grid-template-columns:1fr;gap:10px}
.chap{background:#fbf5e6;border:1.5px solid var(--parch-2);border-radius:3px;padding:14px 16px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.chap:hover{border-color:var(--seal)}
.chap .cn{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--seal)}
.chap .ct{font-family:var(--f-display);font-weight:700;font-size:20px}
.chap .cd{font-size:14px;color:var(--ink-soft)}
@media (max-width:420px){ .sheet{padding:18px 14px 20px} .bins{grid-template-columns:1fr} .dpad{grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px)} .act{width:84px;height:84px} h1{font-size:32px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="ttl">Детектив Энтик</div><div style="display:flex;gap:10px;align-items:center"><div class="date" id="topDate">11 ноября 1762 · Стэпни</div><button class="snd" id="sndBtn" type="button">Звук: вкл</button></div></div>
  <div class="hud">
    <div class="seals" id="seals"></div>
    <div class="meter">
      <div class="meter-label"><span id="meterLbl">Посыльные обыскивают дом</span><span id="pct">0%</span></div>
      <div class="meter-bar"><div class="meter-fill" id="fill"></div></div>
    </div>
    <button class="hint-btn" id="hintBtn" type="button">Подсказка</button>
  </div>
  <div class="goal" id="goal"><b>Цель</b><span id="goalTxt"></span></div>
  <div class="stage">
    <canvas id="cv" width="960" height="432" aria-label="Карта игры"></canvas>
    <div class="dialog" id="dlg" hidden><div class="who" id="dlgWho"></div><div id="dlgTxt"></div><div class="more">нажмите ▸</div></div>
  </div>
  <div class="controls">
    <div class="dpad">
      <button class="u" type="button" data-d="up" aria-label="Вверх">▲</button>
      <button class="l" type="button" data-d="left" aria-label="Влево">◀</button>
      <button class="r" type="button" data-d="right" aria-label="Вправо">▶</button>
      <button class="d" type="button" data-d="down" aria-label="Вниз">▼</button>
    </div>
    <button class="act" id="actBtn" type="button">Действие</button>
  </div>
  <p class="keys">Компьютер: стрелки или WASD — ходить, пробел или E — осмотреть. Телефон: крестик и красная кнопка. Подходите к предметам с золотой меткой.</p>
</div>

<div class="overlay" id="modal" hidden><div id="mbody"></div></div>
<div class="overlay" id="screen"><div id="sbody"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var PEN_MISTAKE = 12, PEN_HINT = 8;
var TS = 16, COLS = 20, ROWS = 9, SCALE = 3;
var S, P, L;
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var shade = document.createElement('canvas'); shade.width = cv.width; shade.height = cv.height;
var sctx = shade.getContext('2d');

function $(id){ return document.getElementById(id); }
function h(tag, attrs){
  var e = document.createElement(tag), k;

  var kids = [];
  (function flat(a){ for (var i=0;i<a.length;i++){ if (Array.isArray(a[i])) flat(a[i]); else kids.push(a[i]); } })(Array.prototype.slice.call(arguments, 2));
  for (var i=0;i<kids.length;i++){ var c = kids[i]; if (c == null || c === false) continue; e.appendChild(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var toastT;
function toast(msg){ var t=$('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function(){ t.hidden = true; }, 2600); }

/* ================= Sound (synthesised, no files) ================= */
var AC = null, muted = false, noiseBuf = null;
try { muted = localStorage.getItem('entick-muted') === '1'; } catch(e){}
function audioInit(){
  try {
    if (!AC){ var C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); }
    if (AC && AC.state === 'suspended') AC.resume();

}
function envG(g, t, a, d, peak){ g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
function tone(freq, type, dur, peak, when, slideTo){
  if (!AC || muted) return;
  try {
    var t = AC.currentTime + (when || 0), o = AC.createOscillator(), g = AC.createGain();

    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    envG(g, t, 0.008, dur, peak); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch(e){}
}

  if (!AC || muted) return;
  try {
    if (!noiseBuf){ noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); var d = noiseBuf.getChannelData(0); for (var i=0;i<d.length;i++) d[i] = Math.random()*2-1; }
    var t = AC.currentTime + (when || 0), s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();

  } catch(e){}
}
var SFX = {
  step: function(){ if (L.id === 1) noise(0.07, 0.10, 'lowpass', 420 + Math.random()*120); else { noise(0.05, 0.07, 'bandpass', 2200 + Math.random()*300, 0, 3); } },
  knock: function(){ for (var i=0;i<3;i++){ tone(90, 'sine', 0.2, 0.55, i*0.24, 50); noise(0.09, 0.3, 'lowpass', 320, i*0.24); } },
  crackle: function(){ noise(0.02, 0.05 + Math.random()*0.05, 'highpass', 3000); },
  ok: function(){ tone(659, 'triangle', 0.25, 0.22); tone(988, 'triangle', 0.45, 0.22, 0.12); },
  bad: function(){ tone(140, 'sawtooth', 0.32, 0.13, 0, 85); },
  door: function(){ tone(230, 'sawtooth', 0.55, 0.05, 0, 130); noise(0.35, 0.05, 'bandpass', 900, 0, 5); noise(0.12, 0.25, 'lowpass', 250, 0.5); },
  page: function(){ noise(0.16, 0.10, 'highpass', 2600); noise(0.12, 0.07, 'highpass', 3200, 0.09); },
  blip: function(){ tone(740, 'square', 0.04, 0.035); },
  gavel: function(){ tone(170, 'square', 0.08, 0.18, 0, 110); noise(0.12, 0.35, 'lowpass', 1400); },
  win: function(){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, 'triangle', 0.4, 0.2, i*0.15); }); tone(1047, 'triangle', 0.9, 0.12, 0.6); },
  murmur: function(){ for (var i=0;i<4;i++) tone(180 + Math.random()*120, 'sine', 0.25, 0.02, i*0.18 + Math.random()*0.1); }
};
function setMuted(m){ muted = m; $('sndBtn').textContent = 'Звук: ' + (m ? 'выкл' : 'вкл'); try { localStorage.setItem('entick-muted', m ? '1' : '0'); } catch(e){} if (!m){ audioInit(); SFX.blip(); } }
$('sndBtn').addEventListener('click', function(){ setMuted(!muted); });
document.addEventListener('touchstart', audioInit, {passive:true});
document.addEventListener('mousedown', audioInit);
document.addEventListener('keydown', audioInit);

/* ================= Drawing primitives ================= */
function R(x,y,w,hh,c){ ctx.fillStyle = c; ctx.fillRect(x,y,w,hh); }
function hash(x,y){ var n = (x*73856093) ^ (y*19349663); n = (n ^ (n >>> 13)) >>> 0; return n; }
function tile(x,y){ if (y<0||y>=ROWS||x<0||x>=COLS) return 'W'; return L.map[y].charAt(x); }
var BOOKC = ['#7a2222','#2c3e6b','#3f6b3a','#8a6a2a','#5a2a4a','#6b4423'];
function isWallish(t){ return 'WwSXMP'.indexOf(t) >= 0 || t === 'F'; }
function drawWallBase(px,py,x,y){
  var pal = L.pal;
  R(px,py,16,16,pal.wall);
  var below = tile(x,y+1);

function sortPuzzle(bins, cards, doneHtml){
  var sel = null, left = cards.length, binEls = [];
  var cardBox = h('div', {'class':'cards'});
  shuffle(cards).forEach(function(c){
    var el = h('button', {'class':'card', type:'button', onclick: function(){
      if (sel) sel.el.classList.remove('sel');
      sel = {c:c, el:el}; el.classList.add('sel'); SFX.blip();
      binEls.forEach(function(b){ b.classList.add('armed'); });
    }}, c.t);
    cardBox.appendChild(el);
  });
  var binBox = h('div', {'class':'bins'}, bins.map(function(b){
    var el = h('button', {'class':'bin', type:'button', onclick: function(){
      if (!sel){ toast('Сначала выберите карточку.'); return; }
      if (sel.c.b === b.id){
        el.appendChild(h('span', {'class':'placed'}, sel.c.t)); SFX.page();
        sel.el.parentNode.removeChild(sel.el); sel = null; left--;
        binEls.forEach(function(x){ x.classList.remove('armed'); });
        if (left === 0) solved(doneHtml);
      } else penalty(PEN_MISTAKE, '«' + sel.c.t + '» — не сюда.', el);
    }}, h('span', {'class':'bn'}, b.n), h('span', {'class':'bd'}, b.d));
    binEls.push(el); return el;
  }));
  return h('div', {'class':'lock'}, cardBox, binBox);
}
function quizPuzzle(items, doneHtml, wrongMsg){
  var done = 0;
  return h('div', {'class':'lock'}, items.map(function(a){
    var opts = h('div', {'class':'opts'}), fin = false, expl = h('div', {'class':'fb good', hidden:true});
    shuffle([{t:a.right, ok:true}].concat(a.wrong.map(function(t){ return {t:t, ok:false}; }))).forEach(function(o){
      var b = h('button', {'class':'opt', type:'button', onclick: function(){
        if (fin) return;
        if (o.ok){
          fin = true; b.classList.add('right'); SFX.ok();
          Array.prototype.forEach.call(opts.querySelectorAll('.opt'), function(x){ if (x !== b) x.disabled = true; });
          if (a.explain){ expl.hidden = false; expl.innerHTML = a.explain; }
          if (++done === items.length) solved(doneHtml);
        } else { b.classList.add('wrong'); b.disabled = true; penalty(PEN_MISTAKE, wrongMsg || 'Неверно.', b); }
      }}, o.t);
      opts.appendChild(b);
    });
    return h('div', {'class':'arg'}, h('div', {'class':'who'}, a.who), h('p', {'class':'claim'}, a.claim), opts, expl);
  }));
}
function dialPuzzle(dials, doneHtml, btnText){
  var state = dials.map(function(){ return 0; });
  var lock = h('div', {'class':'lock'}, dials.map(function(d,i){
    var v = h('span', {'class':'val'}, d.vals[0]);
    return h('div', {'class':'dial'},
      h('div', {'class':'stem'}, d.stem, v),
      h('button', {'class':'turn', type:'button', 'aria-label':'Повернуть диск', onclick: function(){ state[i] = (state[i]+1) % d.vals.length; v.textContent = d.vals[state[i]]; tone(300 + i*60, 'square', 0.03, 0.05); }}, '↻'));
  }));
  var open = h('button', {'class':'btn', type:'button', onclick: function(){
    var wrong = 0; dials.forEach(function(d,i){ if (state[i] !== d.ok) wrong++; });
    if (!wrong){ open.disabled = true; solved(doneHtml); }
    else penalty(PEN_MISTAKE, 'Не поддаётся. Неверных дисков: ' + wrong + '.', lock);
  }}, btnText);
  return h('div', {'class':'lock'}, lock, h('div', {'class':'btn-row'}, open));
}

}
function penalty(amount, msg, el){
  S.danger = Math.min(100, S.danger + amount);
  if (amount === PEN_MISTAKE){ S.mistakes++; SFX.bad(); }
  if (el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
  updateHud();
  if (msg) toast(msg);
  if (S.danger >= 100) setTimeout(caught, 700);
}
function solid(x,y){
  var t = tile(x,y);
  if (t === '1' || t === '2') return !S.doors[t];
  return L.walk.indexOf(t) < 0;
}
var DIRS = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

/* ================= Dialog ================= */
var dlgQueue = [], dlgDone = null;
function say(lines, done){ dlgQueue = lines.slice(); dlgDone = done || null; nextLine(); }
function nextLine(){
  if (!dlgQueue.length){ $('dlg').hidden = true; if (S.mode === 'dialog') S.mode = 'play'; var d = dlgDone; dlgDone = null; if (d) d(); return; }
  var l = dlgQueue.shift(); SFX.blip();
  $('dlgWho').textContent = l[0]; $('dlgTxt').textContent = l[1];
  $('dlg').hidden = false; S.mode = 'dialog';
}
$('dlg').addEventListener('click', function(){ if (S.mode === 'dialog') nextLine(); });

/* ================= Interaction ================= */
function npcLines(){ var ls = L.npc.lines; return ls[Math.min(S.stage, ls.length-1)]; }
function targetTile(){
  var d = DIRS[P.dir], cands = [[P.x+d[0], P.y+d[1]]];
  ['up','down','left','right'].forEach(function(k){ cands.push([P.x+DIRS[k][0], P.y+DIRS[k][1]]); });
  cands.push([P.x, P.y]);
  var best = null;
  for (var i=0;i<cands.length;i++){
    var t = tile(cands[i][0], cands[i][1]);
    if (L.stageTiles.indexOf(t) === S.stage) return t;
    if (!best && (L.stageTiles.indexOf(t) >= 0 || t === L.npc.ch || t === '1' || t === '2' || L.flavor[t])) best = t;
  }
  return best;
}
function interact(){
  if (S.mode === 'dialog'){ nextLine(); return; }
  if (S.mode !== 'play' || P.moving) return;
  var t = targetTile();
  if (!t){ toast('Здесь ничего нет. Подойдите к предмету с золотой меткой.'); return; }
  var si = L.stageTiles.indexOf(t);
  if (si >= 0){
    if (si === S.stage){ openStage(si); return; }
    if (si < S.stage){ say([['Вы','Здесь всё уже сделано.']]); return; }
    say([['Вы','Пока рано. ' + STAGES[S.stage].goal]]); return;
  }
  if (t === L.npc.ch){ say(npcLines()); return; }
  if (t === '1' || t === '2'){ say([['Вы','Дверь заперта. ' + STAGES[S.stage].goal]]); return; }
  if (L.flavor[t]) say([L.flavor[t]]);
}

/* ================= Movement & input ================= */
var held = [];
function press(d){ if (held.indexOf(d) < 0) held.push(d); }
function release(d){ var i = held.indexOf(d); if (i >= 0) held.splice(i,1); }
var KEYS = { ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down', ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right' };
document.addEventListener('keydown', function(e){
  if (S.mode === 'modal' || S.mode === 'screen') return;
  var d = KEYS[e.code] || KEYS[e.key];
  if (d){ e.preventDefault(); press(d); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'KeyE' || e.key === ' ' || e.key === 'e' || e.key === 'у'){ e.preventDefault(); if (!e.repeat) interact(); }
});
document.addEventListener('keyup', function(e){ var d = KEYS[e.code] || KEYS[e.key]; if (d) release(d); });
window.addEventListener('blur', function(){ held = []; });

Array.prototype.forEach.call(document.querySelectorAll('.dpad button'), function(b){
  var d = b.getAttribute('data-d');
  function on(e){ e.preventDefault(); audioInit(); b.classList.add('on'); press(d); if (S.mode === 'dialog') nextLine(); }
  function off(e){ if (e) e.preventDefault(); b.classList.remove('on'); release(d); }
  b.addEventListener('touchstart', on, {passive:false});
  b.addEventListener('touchend', off, {passive:false});
  b.addEventListener('touchcancel', off, {passive:false});
  b.addEventListener('mousedown', on);
  b.addEventListener('mouseup', off);
  b.addEventListener('mouseleave', function(){ b.classList.remove('on'); release(d); });
});
var act = $('actBtn'), actTouched = 0;
act.addEventListener('touchstart', function(e){ e.preventDefault(); audioInit(); actTouched = Date.now(); interact(); }, {passive:false});
act.addEventListener('click', function(){ if (Date.now() - actTouched < 600) return; interact(); });
$('hintBtn').addEventListener('click', function(){
  if (S.mode === 'screen' || S.stage >= STAGES.length) return;
  if (!S.hintUsed[S.stage]){ S.hintUsed[S.stage] = true; S.hints++; penalty(PEN_HINT); }
  if (S.mode === 'modal'){ var hb = $('hintbox'); if (hb){ hb.hidden = false; hb.textContent = 'Подсказка: ' + STAGES[S.stage].hint; } return; }
  say([['Подсказка', STAGES[S.stage].hint]]);
});

var STEP_MS = 150;
function tryMove(now){
  if (P.moving || S.mode !== 'play' || !held.length) return;
  var d = held[held.length-1]; P.dir = d;
  var nx = P.x + DIRS[d][0], ny = P.y + DIRS[d][1];
  if (solid(nx, ny)) return;
  P.fx = P.x; P.fy = P.y; P.tx = nx; P.ty = ny; P.moving = true; P.t = now; SFX.step();
}
function stepMove(now){ if (P.moving && now - P.t >= STEP_MS){ P.x = P.tx; P.y = P.ty; P.moving = false; } }
function playerPos(now){
  if (!P.moving) return [P.x, P.y];
  var k = Math.min(1, (now - P.t) / STEP_MS);
  return [P.fx + (P.tx-P.fx)*k, P.fy + (P.ty-P.fy)*k];
}

/* ================= Render ================= */
var tileCache = {};
function findTile(c){ if (tileCache[c]) return tileCache[c]; for (var y=0;y<ROWS;y++){ var x = L.map[y].indexOf(c); if (x>=0) return (tileCache[c] = [x,y]); } return [0,0]; }
function forEachTile(c, fn){ for (var y=0;y<ROWS;y++) for (var x=0;x<COLS;x++) if (L.map[y].charAt(x)===c) fn(x,y); }
function light(x,y,r,a){
  var g = sctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(0,0,0,'+a+')'); g.addColorStop(.6,'rgba(0,0,0,'+(a*.6)+')'); g.addColorStop(1,'rgba(0,0,0,0)');
  sctx.fillStyle = g; sctx.fillRect(x-r,y-r,r*2,r*2);
}
function draw(now){
  ctx.setTransform(SCALE,0,0,SCALE,0,0);
  ctx.imageSmoothingEnabled = false;
  var x, y, t, px, py;
  for (y=0;y<ROWS;y++) for (x=0;x<COLS;x++){
    t = tile(x,y); px = x*TS; py = y*TS;
    if (t === 'W'){ drawWallBase(px,py,x,y); continue; }
    if (t === '.' || t === L.npc.ch){ drawFloorBase(px,py,x,y); continue; }
    if (t === '1' || t === '2'){ drawFloorBase(px,py,x,y); drawDoorTile(px,py,t); continue; }
    L.draw(t,px,py,x,y,now);
  }
  var ep = findTile(L.npc.ch);
  drawChar(ep[0]*TS, ep[1]*TS, L.npc.coat, L.npc.hair, 'down', Math.floor(now/600)%2, L.npc.wig, L.npc.robe);
  var pp = playerPos(now);
  var bob = P.moving ? (Math.floor(now/80)%2) : 0;
  drawChar(Math.round(pp[0]*TS), Math.round(pp[1]*TS), L.id === 1 ? '#3f6b3a' : '#1a1a22', '#2b1d12', P.dir, -bob, L.id === 2, L.id === 2);
  if (S.stage < L.stageTiles.length){
    var ot = findTile(L.stageTiles[S.stage]);
    var my = ot[1]*TS - 6 + Math.round(Math.sin(now/220)*2), mx = ot[0]*TS + 6;
    if (my < 1) my = ot[1]*TS + 1 + Math.round(Math.sin(now/220)*2);
    R(mx+1, my, 2, 1, '#e8a33d'); R(mx, my+1, 4, 2, '#e8a33d'); R(mx+1, my+3, 2, 1, '#e8a33d');
  }
  ctx.setTransform(1,0,0,1,0,0);
  sctx.globalCompositeOperation = 'source-over';
  sctx.clearRect(0,0,shade.width,shade.height);
  sctx.fillStyle = 'rgba(8,5,3,' + L.shadeA + ')'; sctx.fillRect(0,0,shade.width,shade.height);
  sctx.globalCompositeOperation = 'destination-out';
  light((pp[0]*TS+8)*SCALE, (pp[1]*TS+8)*SCALE, 70*SCALE, 1);
  forEachTile(L.lights, function(x,y){ light((x*TS+8)*SCALE, (y*TS+4)*SCALE, (46 + Math.sin(now/170+x)*2)*SCALE, .95); });
  light((ep[0]*TS+8)*SCALE, (ep[1]*TS+8)*SCALE, 26*SCALE, .6);
  if (S.stage < L.stageTiles.length){ var o2 = findTile(L.stageTiles[S.stage]); light((o2[0]*TS+8)*SCALE, (o2[1]*TS+8)*SCALE, 24*SCALE, .7); }
  ctx.drawImage(shade, 0, 0);
}

function ambient(now){
  if (S.mode === 'screen' || S.mode === 'intro') return;
  if (L.id === 1){
    if (S.stage <= 2 && now > S.nextKnock){
      if (S.nextKnock){ SFX.knock(); S.knockShakeUntil = now + 800; }
      S.nextKnock = now + 7000 + Math.random()*6000;
    }
    if (now > S.nextCrackle){ SFX.crackle(); S.nextCrackle = now + 400 + Math.random()*1800; }
  } else {
    if (now > S.nextKnock){ if (S.nextKnock) SFX.murmur(); S.nextKnock = now + 9000 + Math.random()*8000; }
  }
}
function loop(now){
  if (!now) now = performance.now();
  stepMove(now); tryMove(now); ambient(now);
  if (S.mode === 'play' && Date.now() - S.lastTick > 25000){ S.lastTick = Date.now(); penalty(1); }
  if (S.mode !== 'play') S.lastTick = Math.max(S.lastTick, Date.now() - 25000);
  draw(now);
  requestAnimationFrame(loop);
}

/* ================= Overlays ================= */
function openModal(nodes){
  S.mode = 'modal'; held = [];
  var mb = $('mbody'); mb.innerHTML = '';
  nodes.forEach(function(n){ mb.appendChild(n); });
  $('modal').hidden = false; $('modal').scrollTop = 0;
}
function closeModal(){ $('modal').hidden = true; S.mode = 'play'; }
function openScreen(nodes){
  S.mode = 'screen'; held = [];
  var sb = $('sbody'); sb.innerHTML = '';
  nodes.forEach(function(n){ sb.appendChild(n); });
  $('screen').hidden = false; $('screen').scrollTop = 0;
}
function closeScreen(){ $('screen').hidden = true; S.mode = 'play'; }
function openStage(i){
  var st = STAGES[i];
  if (L.id === 2 && i === 4) SFX.gavel(); else SFX.page();
  openModal([h('div', {'class':'sheet'},
    h('div', {'class':'eyebrow'}, st.eyebrow),
    h('h2', null, st.title),
    h('p', null, st.story),
    h('p', {'class':'task'}, st.task),
    st.body(),
    h('p', {'class':'note', id:'hintbox', hidden:true}),
    h('div', {'class':'btn-row'}, h('button', {'class':'btn ghost', type:'button', onclick: closeModal}, 'Отойти'))
  )]);
}
function solved(html){
  var st = S.stage; SFX.ok();
  var next = h('button', {'class':'btn', type:'button', onclick: function(){
    closeModal(); S.stage = st + 1;
    for (var dk in L.doorsAfter){ if (L.doorsAfter[dk] === st){ S.doors[dk] = true; SFX.door(); } }
    updateHud();
    if (S.stage >= STAGES.length){ finale(); return; }
    say(STAGES[st].after);
  }}, st === STAGES.length-1 ? 'Завершить главу' : 'Продолжить');
  var box = h('div', {'class':'sheet'}, h('div', {'class':'eyebrow'}, L.id === 1 ? 'Замок открыт' : 'Дело решено'), h('div', {'class':'fb good', html:html}), h('div', {'class':'btn-row'}, next));
  $('mbody').appendChild(box);
  try { box.scrollIntoView({block:'start', behavior:'smooth'}); } catch(e){ box.scrollIntoView(); }
}

/* ================= Screens ================= */
function chapterButton(i, label){
  var lv = LEVELS[i];
  return h('button', {'class':'chap', type:'button', onclick: function(){ audioInit(); SFX.blip(); startLevel(i); levelIntro(); }},
    h('span', {'class':'cn'}, label), h('span', {'class':'ct'}, lv.name.replace(/^Глава [IV]+\. /,'')), h('span', {'class':'cd'}, i === 0 ? 'Лекция 1: понятие, источники и принципы. Entick v Carrington.' : 'Лекция 2: институты и механизмы. M v Home Office, GCHQ, Wednesbury.'));
}
function menu(){
  startLevel(0);
  openScreen([
    h('div', {'class':'intro'},
      h('div', {'class':'date'}, 'Тема 4 · Основы английского публичного права'),
      h('h1', null, 'Детектив Энтик'),
      h('p', {'class':'lead'}, 'Пиксельная RPG по шести ключевым делам английского публичного права. Ходите по карте, осматривайте предметы и открывайте замки, отвечая на вопросы.')
    ),
    h('div', {'class':'sheet'},
      h('div', {'class':'eyebrow'}, 'Выберите главу'),
      h('div', {'class':'chapters'}, chapterButton(0, 'Глава I'), chapterButton(1, 'Глава II')),
      h('p', {'class':'note'}, 'Управление: стрелки или WASD и пробел на компьютере; крестик и красная кнопка на телефоне. Звук включается кнопкой вверху; на iPhone проверьте, что выключен беззвучный режим.')
    )
  ]);
}
function levelIntro(){
  openScreen([
    h('div', {'class':'intro'},
      h('div', {'class':'date'}, L.date),
      h('h1', null, L.name),
      h('p', {'class':'lead'}, L.intro.lead),
      h('p', {'class':'sub'}, L.intro.sub)
    ),
    h('div', {'class':'sheet'},
      h('div', {'class':'eyebrow'}, 'Как играть'),
      h('p', null, 'Золотая метка показывает, куда идти. Подойдите к предмету и нажмите «Действие» или пробел. Если не знаете, что делать, поговорите с персонажем на карте.'),
      h('div', {'class':'btn-row'},
        h('button', {'class':'btn', type:'button', onclick: function(){ audioInit(); closeScreen(); S.start = Date.now(); S.lastTick = Date.now(); say(npcLines()); }}, 'Начать'),
        h('button', {'class':'btn ghost', type:'button', onclick: menu}, 'К выбору главы'))
    )
  ]);
}
function caught(){
  if (S.mode === 'screen') return;
  var at = S.stage;
  $('modal').hidden = true; $('dlg').hidden = true; SFX.bad();
  openScreen([h('div', {'class':'sheet'},
    h('div', {'class':'eyebrow'}, 'Шкала дошла до 100%'),
    h('h2', null, L.caught[0]),
    h('p', null, L.caught[1] + ' Можно продолжить с задания ' + (at+1) + ': шкала опустится до 50%.'),
    h('div', {'class':'btn-row'},
      h('button', {'class':'btn', type:'button', onclick: function(){ S.danger = 50; updateHud(); closeScreen(); }}, 'Продолжить'),
      h('button', {'class':'btn ghost', type:'button', onclick: menu}, 'В меню'))
  )]);
}
function finale(){
  SFX.win();
  var secs = Math.max(1, Math.round((Date.now() - S.start)/1000));
  var mm = Math.floor(secs/60), ss = ('0' + (secs%60)).slice(-2);
  var score = S.mistakes + S.hints;
  var rank = score === 0 ? 'Лорд главный судья' : score <= 3 ? 'Королевский адвокат' : score <= 7 ? 'Барристер' : 'Студент-правовед';
  function row(y,c,l){ return h('li', null, h('span', {'class':'yr'}, y), h('div', null, h('div', {'class':'cs'}, c), h('div', {'class':'ln'}, l))); }
  var buttons = [];
  if (L.id === 1) buttons.push(h('button', {'class':'btn', type:'button', onclick: function(){ startLevel(1); levelIntro(); }}, 'Глава II'));
  buttons.push(h('button', {'class':L.id === 1 ? 'btn ghost' : 'btn', type:'button', onclick: menu}, 'В меню'));
  openScreen([
    h('div', {'class':'intro'},
      h('div', {'class':'date'}, L.finale.date),
      h('h1', null, L.finale.title),
      h('p', {'class':'lead'}, L.finale.lead + ' Ваше звание: ' + rank + '.')
    ),
    h('div', {'class':'sheet'},
      h('div', {'class':'eyebrow'}, L.name),
      h('div', {'class':'stats'},
        h('div', {'class':'stat'}, h('span', {'class':'k'}, 'Время'), h('span', {'class':'v'}, mm + ':' + ss)),
        h('div', {'class':'stat'}, h('span', {'class':'k'}, 'Ошибки'), h('span', {'class':'v'}, String(S.mistakes))),
        h('div', {'class':'stat'}, h('span', {'class':'k'}, 'Подсказки'), h('span', {'class':'v'}, String(S.hints)))
      ),
      h('div', {'class':'eyebrow'}, 'Шесть дел темы'),
      h('ul', {'class':'timeline'},
        row('1765','Entick v Carrington','Власть действует только на основании нормы права.'),
        row('1947','Wednesbury','Суд отменяет лишь абсурдно неразумные решения властей.'),
        row('1984','GCHQ','Три основания judicial review; прерогатива подконтрольна суду.'),
        row('1993','M v Home Office','Министр обязан исполнять решения суда.'),
        row('2005','Jackson','Суверенитет Парламента — норма общего права.'),
        row('2019','Miller','Прерогатива не может парализовать Парламент.')
      ),
      h('p', {'class':'note'}, 'Покажите этот экран преподавателю: время, ошибки и подсказки.'),
      h('div', {'class':'btn-row'}, buttons)
    )
  ]);
}

setMuted(muted);
menu();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
